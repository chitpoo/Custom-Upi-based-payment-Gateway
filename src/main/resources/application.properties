server.port=8080
# MySQL — so you can see and query real SQL
spring.datasource.url=jdbc:mysql://localhost:3306/upidb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Show every SQL query in console (this is what you wanted to learn)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

baseten.api.key=${BASETEN_API_KEY:}
baseten.api.baseUrl=https://inference.baseten.co/v1
baseten.api.model=meta-models/muse-spark-open-1026
app.expiry-minutes=10
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
